[project]
name = "agno-production-template"
version = "0.1.0"
description = "Production-oriented Agno 3.x + AgentOS starter"
readme = "README.md"
requires-python = ">=3.11,<4"
dependencies = [
  "agno[os,openai,postgres,mcp]>=3.0,<4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.9",
]

[project.scripts]
agno-app = "agno_app.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agno_app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
